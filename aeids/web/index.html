<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5FFF4">
  <title>AEIDS · Autonomous Enterprise Intelligence &amp; Decision System</title>
  <meta name="description" content="AEIDS: upload company reports, ask questions, get answers where every number is checked.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFBB00'/%3E%3Cpath d='M9 23l7-14 7 14M11.8 18h8.4' stroke='%231D2B22' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    let t = null;
    try { t = localStorage.getItem("aeids-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : "light";
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation and history">
      <div class="side-top">
        <a class="brand" href="#/workflows" aria-label="AEIDS home">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="12" fill="#FFBB00"/>
            <path d="M11 29l9-18 9 18M14.6 22.5h10.8" stroke="#1D2B22" stroke-width="3.2" fill="none"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand-text">
            <span class="brand-name">AEIDS</span>
            <span class="brand-full">Autonomous Enterprise Intelligence &amp; Decision System</span>
          </span>
        </a>
        <button class="btn icon ghost side-close" id="side-close" type="button" aria-label="Hide the panel"></button>
      </div>
      <a class="btn primary new-q" id="new-q" href="#/workflows"></a>
      <nav class="side-nav" id="nav" aria-label="Pages"></nav>
      <div class="side-scroll">
        <details class="side-section">
          <summary class="side-label">Recent questions<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
          <div class="side-list" id="side-recent"></div>
        </details>
        <details class="side-section">
          <summary class="side-label">Reports<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
          <div class="side-list" id="side-reports"></div>
        </details>
      </div>
      <div class="side-foot">
        <select class="select" id="tenant-select" title="Workspace: whose reports you are looking at" aria-label="Workspace"></select>
        <div class="side-tools">
          <label class="toggle small" id="live-toggle" title="Update this page every few seconds" hidden>
            <input type="checkbox" id="auto-refresh"> <span class="live-dot" id="live-dot" hidden></span> Live
          </label>
          <button class="btn icon ghost" id="refresh-btn" type="button" title="Refresh" aria-label="Refresh"></button>
          <button class="btn icon ghost" id="theme-btn" type="button"></button>
          <details class="more" id="more">
            <summary class="btn ghost">More</summary>
            <div class="more-menu">
              <div class="more-label">For engineers</div>
              <div id="more-menu"></div>
              <div class="model-chip" id="model-chip"></div>
            </div>
          </details>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <div class="mobilebar">
        <button class="btn icon ghost" id="side-open" type="button" aria-label="Show the panel"></button>
        <span class="brand-name" title="Autonomous Enterprise Intelligence &amp; Decision System">AEIDS</span>
      </div>
      <div class="page-head">
        <h1 id="page-title"></h1>
        <div class="crumb" id="page-crumb"></div>
      </div>
      <section class="content" id="view" aria-live="polite"></section>
    </main>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>

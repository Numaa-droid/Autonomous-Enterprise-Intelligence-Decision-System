<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
  <title id="t">Retrieval benchmark</title>
  <desc id="d">Share of 31 questions whose correct page is in the top 5 and top 10 results: exact words 55% and 81%, meaning 61% and 81%, hybrid 77% and 90%.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <radialGradient id="glowV" cx=".08" cy="-.05" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1280" height="470" fill="url(#fadeGrid)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2.8s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.grow,.pop{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="470" rx="24" fill="#060a14"/>
  <rect width="1280" height="470" rx="24" fill="url(#glowV)"/>
  <rect width="1280" height="470" rx="24" fill="url(#glowC)"/>
  <rect width="1280" height="470" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x=".5" y=".5" width="1279" height="469" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>

<text class="sans" x="48.0" y="70.0" font-size="30" fill="#e7ecf6" font-weight="800" letter-spacing="-.6">Does search find the right page?</text><text class="sans" x="48.0" y="100.0" font-size="15.5" fill="#8d99b3">31 questions with known answer pages, over the annual reports of Apple, Microsoft, NVIDIA, Tesla and Alphabet.</text>
<line x1="96" y1="378.0" x2="796" y2="378.0" stroke="#94a3b8" stroke-opacity="0.35"/>
<text class="sans" x="84.0" y="382.0" font-size="11.5" fill="#8d99b3" text-anchor="end">0%</text>
<line x1="96" y1="325.5" x2="796" y2="325.5" stroke="#94a3b8" stroke-opacity="0.12"/>
<text class="sans" x="84.0" y="329.5" font-size="11.5" fill="#8d99b3" text-anchor="end">25%</text>
<line x1="96" y1="273.0" x2="796" y2="273.0" stroke="#94a3b8" stroke-opacity="0.12"/>
<text class="sans" x="84.0" y="277.0" font-size="11.5" fill="#8d99b3" text-anchor="end">50%</text>
<line x1="96" y1="220.5" x2="796" y2="220.5" stroke="#94a3b8" stroke-opacity="0.12"/>
<text class="sans" x="84.0" y="224.5" font-size="11.5" fill="#8d99b3" text-anchor="end">75%</text>
<line x1="96" y1="168.0" x2="796" y2="168.0" stroke="#94a3b8" stroke-opacity="0.12"/>
<text class="sans" x="84.0" y="172.0" font-size="11.5" fill="#8d99b3" text-anchor="end">100%</text>
<rect x="149.66666666666669" y="262.5" width="58" height="115.5" rx="8" fill="url(#gradV)" fill-opacity=".7"/>
<text class="sans" x="178.7" y="253.5" font-size="14" fill="#c4b5fd" font-weight="800" text-anchor="middle">55%</text>
<rect x="217.66666666666669" y="207.9" width="58" height="170.1" rx="8" fill="url(#gradC)" fill-opacity=".7"/>
<text class="sans" x="246.7" y="198.9" font-size="14" fill="#67e8f9" font-weight="800" text-anchor="middle">81%</text>
<text class="sans" x="212.7" y="404.0" font-size="15" fill="#a9b4cc" font-weight="800" text-anchor="middle">Exact words</text>
<text class="sans" x="212.7" y="423.0" font-size="11.5" fill="#8d99b3" text-anchor="middle">keyword · PostgreSQL</text>
<rect x="383.00000000000006" y="249.9" width="58" height="128.1" rx="8" fill="url(#gradV)" fill-opacity=".7"/>
<text class="sans" x="412.0" y="240.9" font-size="14" fill="#c4b5fd" font-weight="800" text-anchor="middle">61%</text>
<rect x="451.00000000000006" y="207.9" width="58" height="170.1" rx="8" fill="url(#gradC)" fill-opacity=".7"/>
<text class="sans" x="480.0" y="198.9" font-size="14" fill="#67e8f9" font-weight="800" text-anchor="middle">81%</text>
<text class="sans" x="446.0" y="404.0" font-size="15" fill="#a9b4cc" font-weight="800" text-anchor="middle">Meaning</text>
<text class="sans" x="446.0" y="423.0" font-size="11.5" fill="#8d99b3" text-anchor="middle">dense · Qdrant</text>
<rect x="616.3333333333334" y="216.3" width="58" height="161.7" rx="8" fill="url(#gradV)" fill-opacity="1"/>
<text class="sans" x="645.3" y="207.3" font-size="14" fill="#c4b5fd" font-weight="800" text-anchor="middle">77%</text>
<rect x="684.3333333333334" y="189.0" width="58" height="189.0" rx="8" fill="url(#gradC)" fill-opacity="1"/>
<text class="sans" x="713.3" y="180.0" font-size="14" fill="#67e8f9" font-weight="800" text-anchor="middle">90%</text>
<rect class="pulse" x="604.3333333333334" y="156" width="150" height="222" rx="12" fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-dasharray="4 4"/>
<text class="sans" x="679.3" y="404.0" font-size="15" fill="#e7ecf6" font-weight="800" text-anchor="middle">Hybrid</text>
<text class="sans" x="679.3" y="423.0" font-size="11.5" fill="#8d99b3" text-anchor="middle">both, fused with RRF</text>
<rect x="96" y="140" width="14" height="14" rx="4" fill="url(#gradV)"/>
<text class="sans" x="118.0" y="152.0" font-size="12.5" fill="#a9b4cc">right page in the top 5</text>
<rect x="286" y="140" width="14" height="14" rx="4" fill="url(#gradC)"/>
<text class="sans" x="308.0" y="152.0" font-size="12.5" fill="#a9b4cc">right page in the top 10</text>
<rect x="852" y="140" width="380" height="290" rx="16" fill="#0d1424" stroke="#8b5cf6" stroke-opacity=".4" filter="url(#shadow)"/>
<text class="sans" x="880.0" y="180.0" font-size="11" fill="#c4b5fd" font-weight="700" letter-spacing="1.4">HYBRID SEARCH, THE DEFAULT</text>
<text class="sans" x="880.0" y="246.0" font-size="60" fill="url(#gradH)" font-weight="800" letter-spacing="-2">77%</text>
<text class="sans" x="1020.0" y="224.0" font-size="14" fill="#a9b4cc">of questions: the right</text>
<text class="sans" x="1020.0" y="244.0" font-size="14" fill="#a9b4cc">page is in the top 5</text>
<text class="sans" x="880.0" y="324.0" font-size="60" fill="url(#gradH)" font-weight="800" letter-spacing="-2">90%</text>
<text class="sans" x="1020.0" y="302.0" font-size="14" fill="#a9b4cc">of questions: the right</text>
<text class="sans" x="1020.0" y="322.0" font-size="14" fill="#a9b4cc">page is in the top 10</text>
<line x1="880" y1="354" x2="1204" y2="354" stroke="#94a3b8" stroke-opacity=".2"/>
<text class="sans" x="880.0" y="382.0" font-size="12.5" fill="#8d99b3">Repeatable: a pinned embedding provider and</text>
<text class="sans" x="880.0" y="401.0" font-size="12.5" fill="#8d99b3">cached question vectors give identical ranks.</text>
</svg>
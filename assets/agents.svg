<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="t d">
  <title id="t">The AEIDS agent team</title>
  <desc id="d">A question goes to the Supervisor, which sends typed tasks to the Document Intelligence, Financial Analyst and Verification agents; only verified findings reach the report. PostgreSQL stores all state.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <radialGradient id="glowV" cx=".08" cy="-.05" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1280" height="620" fill="url(#fadeGrid)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2.8s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.grow,.pop{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="620" rx="24" fill="#060a14"/>
  <rect width="1280" height="620" rx="24" fill="url(#glowV)"/>
  <rect width="1280" height="620" rx="24" fill="url(#glowC)"/>
  <rect width="1280" height="620" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x=".5" y=".5" width="1279" height="619" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>

<text class="sans" x="48.0" y="70.0" font-size="30" fill="#e7ecf6" font-weight="800" letter-spacing="-.6">The agent team</text><text class="sans" x="48.0" y="100.0" font-size="15.5" fill="#8d99b3">Like an analyst team with a strict auditor. Agents exchange typed messages through the Supervisor, never directly.</text>
<rect x="48" y="140" width="300" height="132" rx="16" fill="#0d1424" stroke="#f59e0b" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="62" y="140" width="272" height="3" rx="1.5" fill="#f59e0b" fill-opacity=".9"/>
<rect x="68" y="162" width="52" height="52" rx="14" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".45"/><circle cx="94.0" cy="181.0" r="7.5" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M80.0 205.0c0-9 6-14 14-14s14 5 14 14" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="136.0" y="181.0" font-size="11" fill="#fcd34d" font-weight="700" letter-spacing="1.4">YOU</text>
<text class="sans" x="136.0" y="206.0" font-size="20" fill="#e7ecf6" font-weight="800">A question</text>
<text class="sans" x="68.0" y="242.0" font-size="13.5" fill="#a9b4cc">“How dependent is NVIDIA on</text>
<text class="sans" x="68.0" y="262.0" font-size="13.5" fill="#a9b4cc">its largest customers?”</text>
<rect x="446" y="140" width="388" height="132" rx="16" fill="#0d1424" stroke="#c4b5fd" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="460" y="140" width="360" height="3" rx="1.5" fill="#c4b5fd" fill-opacity=".9"/>
<rect x="466" y="162" width="52" height="52" rx="14" fill="#c4b5fd" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".45"/><polygon points="508.5,197.5 492.0,207.0 475.5,197.5 475.5,178.5 492.0,169.0 508.5,178.5" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="492.0" cy="188.0" r="5" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="534.0" y="181.0" font-size="11" fill="#c4b5fd" font-weight="700" letter-spacing="1.4">TEAM LEAD</text>
<text class="sans" x="534.0" y="206.0" font-size="20" fill="#e7ecf6" font-weight="800">Supervisor</text>
<text class="sans" x="466.0" y="242.0" font-size="13.5" fill="#a9b4cc">Plans the tasks and their order. The only</text>
<text class="sans" x="466.0" y="262.0" font-size="13.5" fill="#a9b4cc">one allowed to change task state.</text>
<rect x="932" y="140" width="300" height="132" rx="16" fill="#0d1424" stroke="#f59e0b" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="946" y="140" width="272" height="3" rx="1.5" fill="#f59e0b" fill-opacity=".9"/>
<rect x="952" y="162" width="52" height="52" rx="14" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".45"/><path d="M964.0 169.0h28v38h-28z" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M970.0 179.0l2.5 2.5 4-4M979.0 180.0h7M970.0 189.0l2.5 2.5 4-4M979.0 190.0h7M970.0 200.0h16" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="1020.0" y="181.0" font-size="11" fill="#fcd34d" font-weight="700" letter-spacing="1.4">REPORT WRITER</text>
<text class="sans" x="1020.0" y="206.0" font-size="20" fill="#e7ecf6" font-weight="800">Report</text>
<text class="sans" x="952.0" y="242.0" font-size="13.5" fill="#a9b4cc">Verified findings only, each</text>
<text class="sans" x="952.0" y="262.0" font-size="13.5" fill="#a9b4cc">cited; gaps listed as limitations.</text>
<path class="flow" d="M352 206.0 H440" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path class="flow" d="M838 206.0 H926" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
<text class="sans" x="882.0" y="194.0" font-size="11.5" fill="#86efac" font-weight="600" text-anchor="middle">verified</text>
<rect x="48" y="352" width="376" height="196" rx="16" fill="#0d1424" stroke="#22d3ee" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="62" y="352" width="348" height="3" rx="1.5" fill="#22d3ee" fill-opacity=".9"/>
<rect x="68" y="374" width="52" height="52" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><circle cx="91.0" cy="397.0" r="12" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M100.0 406.0l9 9" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M85.0 397.0h12M85.0 402.0h8" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="136.0" y="393.0" font-size="11" fill="#67e8f9" font-weight="700" letter-spacing="1.4">RESEARCHER</text>
<text class="sans" x="136.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Document Intelligence</text>
<text class="sans" x="68.0" y="454.0" font-size="13.5" fill="#a9b4cc">Searches the reports and returns exact</text>
<text class="sans" x="68.0" y="474.0" font-size="13.5" fill="#a9b4cc">quotes with page, section and box.</text>
<rect x="68.0" y="504" width="236" height="28" rx="14.0" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".5"/><text class="sans" x="186.0" y="522.3" font-size="12" fill="#67e8f9" font-weight="600" text-anchor="middle">hybrid search · evidence quotes</text>
<rect x="452" y="352" width="376" height="196" rx="16" fill="#0d1424" stroke="#8b5cf6" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="466" y="352" width="348" height="3" rx="1.5" fill="#8b5cf6" fill-opacity=".9"/>
<rect x="472" y="374" width="52" height="52" rx="14" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/><rect x="484.0" y="381.0" width="28" height="38" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="490.0" y="387.0" width="16" height="7" rx="1.5" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="491.0" cy="403.0" r="1.8" fill="#8b5cf6"/><circle cx="491.0" cy="411.0" r="1.8" fill="#8b5cf6"/><circle cx="498.0" cy="403.0" r="1.8" fill="#8b5cf6"/><circle cx="498.0" cy="411.0" r="1.8" fill="#8b5cf6"/><circle cx="505.0" cy="403.0" r="1.8" fill="#8b5cf6"/><circle cx="505.0" cy="411.0" r="1.8" fill="#8b5cf6"/>
<text class="sans" x="540.0" y="393.0" font-size="11" fill="#c4b5fd" font-weight="700" letter-spacing="1.4">FINANCIAL ANALYST</text>
<text class="sans" x="540.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Financial Analyst</text>
<text class="sans" x="472.0" y="454.0" font-size="13.5" fill="#a9b4cc">Turns figures into ratios and growth.</text>
<text class="sans" x="472.0" y="474.0" font-size="13.5" fill="#a9b4cc">Maths by tested code, never the LLM.</text>
<rect x="472.0" y="504" width="257" height="28" rx="14.0" fill="#8b5cf6" fill-opacity=".13" stroke="#8b5cf6" stroke-opacity=".5"/><text class="sans" x="600.3" y="522.3" font-size="12" fill="#c4b5fd" font-weight="600" text-anchor="middle">calc module · Decimal, never float</text>
<rect x="856" y="352" width="376" height="196" rx="16" fill="#0d1424" stroke="#22c55e" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="870" y="352" width="348" height="3" rx="1.5" fill="#22c55e" fill-opacity=".9"/>
<rect x="876" y="374" width="52" height="52" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".45"/><path d="M902.0 381.0l15 5v11c0 10-6.5 16.5-15 20c-8.5-3.5-15-10-15-20v-11z" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M895.0 400.0l5 5l9-10" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="944.0" y="393.0" font-size="11" fill="#86efac" font-weight="700" letter-spacing="1.4">AUDITOR</text>
<text class="sans" x="944.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Verification</text>
<text class="sans" x="876.0" y="454.0" font-size="13.5" fill="#a9b4cc">Checks every claim against its source.</text>
<text class="sans" x="876.0" y="474.0" font-size="13.5" fill="#a9b4cc">A wrong number or citation is rejected.</text>
<rect x="876.0" y="504" width="195" height="28" rx="14.0" fill="#22c55e" fill-opacity=".13" stroke="#22c55e" stroke-opacity=".5"/><text class="sans" x="973.5" y="522.3" font-size="12" fill="#86efac" font-weight="600" text-anchor="middle">rejected → bounded rework</text>
<path class="flow" d="M560 274 C 560 318, 236.0 308, 236.0 346" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-opacity=".9" marker-end="url(#arrowV)"/>
<path class="flow" d="M640 274 C 640 318, 640.0 308, 640.0 346" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-opacity=".9" marker-end="url(#arrowV)"/>
<path class="flow" d="M720 274 C 720 318, 1044.0 308, 1044.0 346" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-opacity=".9" marker-end="url(#arrowV)"/>
<rect x="498" y="298" width="284" height="28" rx="14" fill="#060a14" stroke="#8b5cf6" stroke-opacity=".6"/>
<text class="mono" x="640.0" y="316.5" font-size="12" fill="#c4b5fd" font-weight="600" text-anchor="middle">typed TaskMessage ↓   AgentResult ↑</text>
<path d="M236.0 550 V564" stroke="#94a3b8" stroke-opacity=".45" stroke-dasharray="2 4"/>
<path d="M640.0 550 V564" stroke="#94a3b8" stroke-opacity=".45" stroke-dasharray="2 4"/>
<path d="M1044.0 550 V564" stroke="#94a3b8" stroke-opacity=".45" stroke-dasharray="2 4"/>
<rect x="48" y="564" width="1184" height="44" rx="14" fill="#0d1424" stroke="#2dd4bf" stroke-opacity=".4"/>
<ellipse cx="78" cy="578" rx="13" ry="5" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 578v20c0 3 6 5 13 5s13-2 13-5v-20M65 588c0 3 6 5 13 5s13-2 13-5" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="106" y="591" font-size="13.5" fill="#a9b4cc"><tspan font-size="14.5" font-weight="700" fill="#e7ecf6">PostgreSQL holds the shared state:</tspan> every task, result, quote and state change is saved, so a workflow resumes after a crash and can be audited.</text>
</svg>
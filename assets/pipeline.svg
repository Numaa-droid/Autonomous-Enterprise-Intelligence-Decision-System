<rect x="1158" y="202" width="56" height="56" rx="14" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".45"/><path d="M1172.0 211.0h28v38h-28z" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1178.0 221.0l2.5 2.5 4-4M1187.0 222.0h7M1178.0 231.0l2.5 2.5 4-4M1187.0 232.0h7M1178.0 242.0h16" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="1096.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Report</text>
<text class="sans" x="1096.0" y="328.0" font-size="12.5" fill="#a9b4cc">Verified findings</text>
<text class="sans" x="1096.0" y="347.0" font-size="12.5" fill="#a9b4cc">only, all cited,</text>
<text class="sans" x="1096.0" y="366.0" font-size="12.5" fill="#a9b4cc">gaps listed</text>
<path class="flow" d="M983.0 402 C 983.0 464, 811.0 464, 811.0 410" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowR)"/>
<text class="sans" x="897.0" y="478.0" font-size="12.5" fill="#fda4af" font-weight="600" text-anchor="middle">wrong number or citation → rejected → rework (limited rounds)</text>
<text class="sans" x="295.0" y="442.0" font-size="12.5" fill="#67e8f9" font-weight="600" text-anchor="middle">a new version becomes current only after its index is verified</text>
<text class="sans" x="48.0" y="527.0" font-size="11" fill="#8d99b3" font-weight="700" letter-spacing="1.4">BUILT WITH</text>

<text class="sans" x="590.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">4</text>
<rect x="642" y="202" width="56" height="56" rx="14" fill="#c4b5fd" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".45"/><rect x="664.0" y="211.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="650.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="664.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="678.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.0 221.0v18M670.0 230.0h-14v9M670.0 230.0h14v9" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

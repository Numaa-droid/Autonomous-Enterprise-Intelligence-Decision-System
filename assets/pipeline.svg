<text class="sans" x="934.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">6</text>
<rect x="986" y="202" width="56" height="56" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".45"/><path d="M1014.0 211.0l15 5v11c0 10-6.5 16.5-15 20c-8.5-3.5-15-10-15-20v-11z" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1007.0 230.0l5 5l9-10" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="924.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Verify</text>
<text class="sans" x="924.0" y="328.0" font-size="12.5" fill="#a9b4cc">Each claim checked</text>
<text class="sans" x="924.0" y="347.0" font-size="12.5" fill="#a9b4cc">against its quote</text>
<text class="sans" x="924.0" y="366.0" font-size="12.5" fill="#a9b4cc">and its numbers</text>
<path class="flow" d="M1061 293.0 H1077" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="1080" y="186" width="150" height="214" rx="16" fill="#0d1424" stroke="#f59e0b" stroke-opacity=".35" filter="url(#shadow)"/>

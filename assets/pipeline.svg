<text class="sans" x="580.0" y="328.0" font-size="12.5" fill="#a9b4cc">Supervisor splits</text>
<text class="sans" x="580.0" y="347.0" font-size="12.5" fill="#a9b4cc">the question into</text>
<text class="sans" x="580.0" y="366.0" font-size="12.5" fill="#a9b4cc">typed tasks</text>
<path class="flow" d="M717 293.0 H733" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="736" y="186" width="150" height="214" rx="16" fill="#0d1424" stroke="#c4b5fd" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="762" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="762.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">5</text>
<rect x="814" y="202" width="56" height="56" rx="14" fill="#c4b5fd" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".45"/><rect x="828.0" y="211.0" width="28" height="38" rx="4" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="834.0" y="217.0" width="16" height="7" rx="1.5" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="835.0" cy="233.0" r="1.8" fill="#c4b5fd"/><circle cx="835.0" cy="241.0" r="1.8" fill="#c4b5fd"/><circle cx="842.0" cy="233.0" r="1.8" fill="#c4b5fd"/><circle cx="842.0" cy="241.0" r="1.8" fill="#c4b5fd"/><circle cx="849.0" cy="233.0" r="1.8" fill="#c4b5fd"/><circle cx="849.0" cy="241.0" r="1.8" fill="#c4b5fd"/>
<text class="sans" x="752.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Investigate</text>
<text class="sans" x="752.0" y="328.0" font-size="12.5" fill="#a9b4cc">Agents quote the</text>
<text class="sans" x="752.0" y="347.0" font-size="12.5" fill="#a9b4cc">evidence; tested</text>
<text class="sans" x="752.0" y="366.0" font-size="12.5" fill="#a9b4cc">code does the maths</text>
<path class="flow" d="M889 293.0 H905" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

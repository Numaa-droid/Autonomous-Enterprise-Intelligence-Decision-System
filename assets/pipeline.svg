<text class="sans" x="246.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">2</text>
<rect x="298" y="202" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><rect x="309.0" y="212.0" width="34" height="36" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M309.0 222.0h34M309.0 232.0h34M309.0 241.0h34M322.0 222.0v26" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="236.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Parse</text>
<text class="sans" x="236.0" y="328.0" font-size="12.5" fill="#a9b4cc">TableLens reads</text>
<text class="sans" x="236.0" y="347.0" font-size="12.5" fill="#a9b4cc">text, tables and</text>
<text class="sans" x="236.0" y="366.0" font-size="12.5" fill="#a9b4cc">charts, page + box</text>
<path class="flow" d="M373 293.0 H389" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="392" y="186" width="150" height="214" rx="16" fill="#0d1424" stroke="#22d3ee" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="418" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="418.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">3</text>
<rect x="470" y="202" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><circle cx="495.0" cy="227.0" r="12" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.0 236.0l9 9" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.0 227.0h12M489.0 232.0h8" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="408.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Index</text>
<text class="sans" x="408.0" y="328.0" font-size="12.5" fill="#a9b4cc">Chunks embedded,</text>
<text class="sans" x="408.0" y="347.0" font-size="12.5" fill="#a9b4cc">searchable by</text>
<text class="sans" x="408.0" y="366.0" font-size="12.5" fill="#a9b4cc">meaning + words</text>

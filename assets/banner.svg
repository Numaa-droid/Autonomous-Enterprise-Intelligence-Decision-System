<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">AEIDS: Autonomous Enterprise Intelligence &amp; Decision System</title>
  <desc id="d">A company report page whose revenue row is cited by a verified finding: a growth figure computed by tested code, with its inputs and the source page.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <radialGradient id="glowV" cx=".08" cy="-.05" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1280" height="460" fill="url(#fadeGrid)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2.8s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.grow,.pop{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#060a14"/>
  <rect width="1280" height="460" rx="24" fill="url(#glowV)"/>
  <rect width="1280" height="460" rx="24" fill="url(#glowC)"/>
  <rect width="1280" height="460" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x=".5" y=".5" width="1279" height="459" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>

<rect x="64" y="64" width="52" height="52" rx="14" fill="url(#grad)"/>
<path d="M90 72l15 5v11c0 10-6.5 16.5-15 20c-8.5-3.5-15-10-15-20v-11z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 91l5 5l9-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="132.0" y="86.0" font-size="17" fill="#e7ecf6" font-weight="700" letter-spacing=".5">AEIDS</text>
<text class="sans" x="132.0" y="107.0" font-size="14" fill="#8d99b3">Autonomous Enterprise Intelligence &amp; Decision System</text>
<text class="sans" x="64.0" y="190.0" font-size="56" fill="#e7ecf6" font-weight="800" letter-spacing="-1.5">Answers you can</text>
<text class="sans" x="64.0" y="252.0" font-size="56" fill="url(#gradH)" font-weight="800" letter-spacing="-1.5">trace to the page.</text>
<text class="sans" x="64.0" y="300.0" font-size="19" fill="#a9b4cc">AI agents that read annual and ESG reports,</text>
<text class="sans" x="64.0" y="326.0" font-size="19" fill="#a9b4cc">check each other's work and cite every claim.</text>
<rect x="64.0" y="358" width="163" height="34" rx="17.0" fill="#8b5cf6" fill-opacity=".13" stroke="#8b5cf6" stroke-opacity=".5"/><text class="sans" x="145.4" y="379.9" font-size="13.5" fill="#c4b5fd" font-weight="600" text-anchor="middle">Every claim cited</text>
<rect x="238.8" y="358" width="163" height="34" rx="17.0" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".5"/><text class="sans" x="320.2" y="379.9" font-size="13.5" fill="#67e8f9" font-weight="600" text-anchor="middle">No LLM arithmetic</text>
<rect x="413.6" y="358" width="217" height="34" rx="17.0" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text class="sans" x="522.0" y="379.9" font-size="13.5" fill="#5eead4" font-weight="600" text-anchor="middle">Verified before reported</text>
<g filter="url(#shadow)"><rect x="672" y="66" width="262" height="330" rx="12" fill="#f8fafc"/></g>
<rect x="692" y="88" width="26" height="26" rx="7" fill="url(#grad)"/>
<rect x="728" y="91" width="93" height="9" rx="4.5" fill="#cbd5e1"/>
<rect x="728" y="106" width="62" height="7" rx="3.5" fill="#e2e8f0"/>
<rect x="854" y="91" width="60" height="7" rx="3.5" fill="#e2e8f0"/>
<line x1="692" y1="128" x2="914" y2="128" stroke="#e2e8f0"/>
<text class="sans" x="692.0" y="154.0" font-size="11" fill="#334155" font-weight="800" letter-spacing="1">PROFIT AND LOSS</text>
<text class="sans" x="914.0" y="154.0" font-size="9.5" fill="#64748b" text-anchor="end">₹ crore</text>
<rect x="692" y="166" width="222" height="22" fill="#eef2ff"/>
<text class="sans" x="698.0" y="181.0" font-size="9.5" fill="#475569" font-weight="700">Particulars</text>
<text class="sans" x="851.6" y="181.0" font-size="9.5" fill="#475569" font-weight="700" text-anchor="end">FY25</text>
<text class="sans" x="908.0" y="181.0" font-size="9.5" fill="#475569" font-weight="700" text-anchor="end">FY24</text>
<rect class="pulse" x="688" y="190" width="230" height="22" rx="4" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="sans" x="698.0" y="205.0" font-size="9.5" fill="#334155" font-weight="700">Revenue from ops</text>
<text class="sans" x="851.6" y="205.0" font-size="9.5" fill="#0f172a" font-weight="700" text-anchor="end">4,500</text>
<text class="sans" x="908.0" y="205.0" font-size="9.5" fill="#334155" font-weight="700" text-anchor="end">4,000</text>
<line x1="692" y1="212" x2="914" y2="212" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="229.0" font-size="9.5" fill="#334155">Other income</text>
<text class="sans" x="851.6" y="229.0" font-size="9.5" fill="#0f172a" text-anchor="end">120</text>
<text class="sans" x="908.0" y="229.0" font-size="9.5" fill="#334155" text-anchor="end">95</text>
<line x1="692" y1="236" x2="914" y2="236" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="253.0" font-size="9.5" fill="#334155">Total expenses</text>
<text class="sans" x="851.6" y="253.0" font-size="9.5" fill="#0f172a" text-anchor="end">3,610</text>
<text class="sans" x="908.0" y="253.0" font-size="9.5" fill="#334155" text-anchor="end">3,280</text>
<line x1="692" y1="260" x2="914" y2="260" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="277.0" font-size="9.5" fill="#334155">Profit before tax</text>
<text class="sans" x="851.6" y="277.0" font-size="9.5" fill="#0f172a" text-anchor="end">1,010</text>
<text class="sans" x="908.0" y="277.0" font-size="9.5" fill="#334155" text-anchor="end">815</text>
<line x1="692" y1="284" x2="914" y2="284" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="301.0" font-size="9.5" fill="#334155">Tax expense</text>
<text class="sans" x="851.6" y="301.0" font-size="9.5" fill="#0f172a" text-anchor="end">255</text>
<text class="sans" x="908.0" y="301.0" font-size="9.5" fill="#334155" text-anchor="end">205</text>
<line x1="692" y1="308" x2="914" y2="308" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="325.0" font-size="9.5" fill="#334155" font-weight="700">Profit for the year</text>
<text class="sans" x="851.6" y="325.0" font-size="9.5" fill="#0f172a" font-weight="700" text-anchor="end">755</text>
<text class="sans" x="908.0" y="325.0" font-size="9.5" fill="#334155" font-weight="700" text-anchor="end">610</text>
<line x1="692" y1="332" x2="914" y2="332" stroke="#eef2f7"/>
<rect x="692" y="354" width="211" height="7" rx="3.5" fill="#e2e8f0"/>
<text class="sans" x="914.0" y="382.0" font-size="9.5" fill="#94a3b8" text-anchor="end">p. 87</text>
<rect x="970" y="92" width="250" height="286" rx="16" fill="#0d1424" stroke="#94a3b8" stroke-opacity=".22" filter="url(#shadow)"/>
<text class="sans" x="990.0" y="124.0" font-size="11" fill="#8d99b3" font-weight="700" letter-spacing="1.4">FINDING</text>
<g class="pop"><rect x="1112" y="107" width="92" height="25" rx="12.5" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".55"/><text class="sans" x="1158.0" y="124.0" font-size="11" fill="#86efac" font-weight="700" text-anchor="middle" letter-spacing=".6">✓ VERIFIED</text></g>
<text class="sans" x="990.0" y="164.0" font-size="21" fill="#e7ecf6" font-weight="800">Revenue grew</text>
<text class="sans" x="990.0" y="191.0" font-size="21" fill="url(#gradH)" font-weight="800">12.5% year on year</text>
<line x1="990" y1="210" x2="1200" y2="210" stroke="#94a3b8" stroke-opacity=".2"/>
<text class="sans" x="990.0" y="236.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">CALCULATION</text>
<text class="mono" x="990.0" y="256.0" font-size="12.5" fill="#c4b5fd">growth_rate(4500, 4000)</text>
<text class="sans" x="990.0" y="282.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">INPUTS</text>
<text class="mono" x="990.0" y="302.0" font-size="12.5" fill="#67e8f9">INR · crore · FY25 vs FY24</text>
<text class="sans" x="990.0" y="328.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">SOURCE</text>
<text class="mono" x="990.0" y="348.0" font-size="12.5" fill="#5eead4">p. 87 · Profit and Loss</text>
<path class="flow" d="M920 201 C 958 201, 934 343, 966 343" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
<text class="sans" x="1216.0" y="430.0" font-size="11" fill="#8d99b3" text-anchor="end" font-style="italic">illustrative example</text>
</svg>